            $ref: "#/components/schemas/DayException"
        edits:
          type: array
          items:
            $ref: "#/components/schemas/TimesheetEdit"
        timesheet:
          $ref: "#/components/schemas/DepartmentReport"
        missing:
          type: array
          items:
            $ref: "#/components/schemas/MissingMark"

