          type: string
          example: "dept-ivt-001"
        from:
          type: string
          format: date
          example: "2026-08-01"
        to:
          type: string
          format: date
          example: "2026-08-31"
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserReport"
        missing_marks:
          type: integer
          example: 3

    EditDayRequest:
      type: object
      required: [user_id, work_date, kind]
      properties:
        user_id:
          type: string
          format: uuid
        work_date:
          type: string
          format: date
        kind:
          type: string
          enum: [attendance, absence, clear]
        opened_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        code:
          type: string
        note:
          type: string

    EditDayResult:
      type: object
      properties:
        kind:
          type: string
        session:
          $ref: "#/components/schemas/AttendanceSession"
        exception:
          $ref: "#/components/schemas/DayException"

    TimesheetEdit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        editor_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        work_date:
          type: string
          format: date
        action:
          type: string
          example: set_attendance
        note:
          type: string
        created_at:
          type: string
          format: date-time

    MissingMark:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        date:
          type: string
          format: date
        day_of_week:
          type: string

    DepartmentExport:
      type: object
      properties:
        department_id:
          type: string
        department_name:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        employees:
          type: array
          items:
